        <style>
        /* ---------- Theme ---------- */
        :root {
            --panel: #0b0b0b;
            --surface: #151515;
            --surface-2: #1d1d1d;
            --line: #2b2b2b;
            --gold: #d4af37;
            --gold-soft: #e9cf7a;
            --gold-dim: rgba(212, 175, 55, 0.18);
            --text: #ece8dc;
            --muted: #9c968a;
            --sb-width: 320px;
            --font: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
        }
        html, body { height: 100%; margin: 0; }
        body { background: var(--panel); font-family: var(--font); color: var(--text); }
        #app { display: flex; height: 100vh; height: 100dvh; width: 100%; overflow: hidden; }

        /* ---------- Sidebar ---------- */
        #sidebar {
            flex: 0 0 var(--sb-width);
            width: var(--sb-width);
            height: 100%;
            background: var(--panel);
            border-right: 1px solid var(--gold-dim);
            display: flex;
            flex-direction: column;
            transition: margin-left .25s ease, transform .25s ease;
            z-index: 1100;
            box-sizing: border-box;
        }
        body.sb-collapsed #sidebar { margin-left: calc(-1 * var(--sb-width)); }
        .sb-head {
            display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
            padding: 18px 16px 14px;
            border-bottom: 1px solid var(--gold-dim);
        }
        .sb-kicker { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
        .sb-head h1 { margin: 4px 0 0; font-size: 18px; line-height: 1.25; font-weight: 600; color: var(--gold); }
        .icon-btn {
            flex: none; width: 32px; height: 32px; border-radius: 6px;
            border: 1px solid var(--line); background: var(--surface); color: var(--gold);
            cursor: pointer; display: grid; place-items: center; font-size: 14px;
        }
        .icon-btn:hover { border-color: var(--gold); }
        .sb-body { flex: 1; overflow-y: auto; padding: 6px 0 24px; scrollbar-color: #333 transparent; }

        /* Collapsible sections */
        .sb-section { border-bottom: 1px solid var(--line); }
        .sb-section > summary {
            list-style: none; cursor: pointer; user-select: none;
            display: flex; align-items: center; gap: 10px;
            padding: 13px 16px;
            font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
            color: var(--gold);
        }
        .sb-section > summary::-webkit-details-marker { display: none; }
        .sb-section > summary::after {
            content: ""; margin-left: auto; width: 7px; height: 7px;
            border-right: 2px solid var(--gold); border-bottom: 2px solid var(--gold);
            transform: rotate(45deg); transition: transform .2s ease; margin-top: -4px;
        }
        .sb-section[open] > summary::after { transform: rotate(-135deg); margin-top: 3px; }
        .sb-section > summary:hover { background: var(--surface); }
        .sb-section > summary .fas { width: 16px; text-align: center; }
        .sb-content { padding: 2px 16px 16px; }
        #sidebar .fa, #sidebar .fas { color: inherit !important; }

        /* Layer groups and rows */
        .lyr-group + .lyr-group { margin-top: 14px; }
        .lyr-group-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 6px 0; margin-bottom: 4px; border-bottom: 1px solid var(--line);
        }
        .lyr-group-title { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-soft); }
        .lyr { padding: 8px 0 6px; }
        .lyr-row { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13.5px; line-height: 1.3; }
        .lyr-name { flex: 1; }
        .lyr-opacity { display: flex; align-items: center; gap: 8px; margin: 6px 0 0 44px; font-size: 11px; color: var(--muted); }
        .lyr-opacity input { flex: 1; }
        .lyr-opacity output { width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
        .lyr.off .lyr-name { color: var(--muted); }
        .lyr.off .lyr-opacity { opacity: .4; }

        /* Gold toggle switch */
        .switch { position: relative; flex: none; width: 34px; height: 18px; }
        .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
        .switch span {
            position: absolute; inset: 0; border-radius: 999px;
            background: #2e2e2e; border: 1px solid #3a3a3a; transition: background .15s, border-color .15s;
            pointer-events: none;
        }
        .switch span::after {
            content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%;
            background: #8a8578; transition: transform .15s, background .15s;
        }
        .switch input:checked + span { background: var(--gold-dim); border-color: var(--gold); }
        .switch input:checked + span::after { transform: translateX(16px); background: var(--gold); }
        .switch input:focus-visible + span { outline: 2px solid var(--gold-soft); outline-offset: 2px; }
        .switch.sm { width: 28px; height: 15px; }
        .switch.sm span::after { width: 9px; height: 9px; }
        .switch.sm input:checked + span::after { transform: translateX(13px); }

        input[type=range] { accent-color: var(--gold); height: 14px; }

        /* Basemaps */
        .bm-option {
            display: flex; align-items: center; gap: 10px; padding: 9px 10px; margin-bottom: 6px;
            border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
            cursor: pointer; font-size: 13.5px;
        }
        .bm-option:hover { border-color: #4a4232; }
        .bm-option input { accent-color: var(--gold); margin: 0; }
        .bm-option.active { border-color: var(--gold); background: var(--surface-2); color: var(--gold-soft); }

        /* Search, measure, buttons */
        .field-row { display: flex; gap: 6px; }
        .sb-input {
            flex: 1; min-width: 0; padding: 8px 10px; border-radius: 6px;
            border: 1px solid var(--line); background: var(--surface); color: var(--text);
            font: inherit; font-size: 13.5px;
        }
        .sb-input:focus { outline: none; border-color: var(--gold); }
        .sb-btn {
            padding: 8px 12px; border-radius: 6px; border: 1px solid var(--gold);
            background: transparent; color: var(--gold); font: inherit; font-size: 13px; font-weight: 600;
            cursor: pointer;
        }
        .sb-btn:hover { background: var(--gold-dim); }
        .sb-btn.solid { background: var(--gold); color: #111; }
        .sb-btn.solid:hover { background: var(--gold-soft); }
        .sb-btn.ghost { border-color: var(--line); color: var(--muted); }
        .sb-btn.ghost:hover { color: var(--text); border-color: #555; background: transparent; }
        .sb-btn.block { width: 100%; margin-top: 8px; }
        .hint { font-size: 12px; color: var(--muted); margin: 8px 0 0; line-height: 1.45; }
        .results { list-style: none; margin: 8px 0 0; padding: 0; max-height: 260px; overflow-y: auto; }
        .results li button {
            width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 8px;
            padding: 7px 8px; border: 0; border-radius: 5px; background: transparent; color: var(--text);
            font: inherit; font-size: 13px; cursor: pointer;
        }
        .results li button:hover { background: var(--surface-2); }
        .results .kind { color: var(--gold); font-size: 11px; white-space: nowrap; }
        .measure-readout {
            margin-top: 10px; padding: 12px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line);
        }
        .measure-readout .label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
        .measure-readout .value { font-size: 22px; font-weight: 600; color: var(--gold); font-variant-numeric: tabular-nums; }
        .btn-row { display: flex; gap: 6px; }
        .btn-row .sb-btn { flex: 1; }

        /* Legend */
        .lg-item { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
        .lg-item:last-child { border-bottom: 0; }
        .lg-name { color: var(--gold-soft); font-weight: 600; margin-bottom: 4px; }
        .lg-item table { border-collapse: collapse; }
        .lg-item td { padding: 2px 8px 2px 0; vertical-align: middle; color: var(--text); }
        .lg-item img { display: block; background: #f2efe6; border-radius: 3px; padding: 1px; }
        .lg-swatch { display: flex; align-items: center; gap: 8px; }

        /* ---------- Map ---------- */
        #map { flex: 1; height: 100%; min-width: 0; }
        #map.measuring { cursor: crosshair; }
        #map .leaflet-bar a,
        #map .leaflet-control-locate a {
            background-color: var(--panel) !important; color: var(--gold) !important;
            border-bottom: 1px solid var(--line);
        }
        #map .leaflet-bar a:hover { background-color: var(--surface-2) !important; }
        #map .leaflet-bar .fa { color: var(--gold) !important; }
        #map.leaflet-touch .leaflet-bar { border: 1px solid var(--gold-dim) !important; }
        #map .leaflet-control-attribution { background: rgba(11,11,11,.8); color: #bdb7a8; }
        #map .leaflet-control-attribution a { color: var(--gold-soft) !important; }
        .sb-toggle-ctrl a { display: grid !important; place-items: center; font-size: 15px; cursor: pointer; }
        body:not(.sb-collapsed) .sb-toggle-ctrl { display: none; }
        .measure-tip { background: var(--panel) !important; color: var(--gold) !important; border: 1px solid var(--gold) !important; border-radius: 4px; padding: 2px 6px; font-size: 12px; }

        /* ---------- Mobile: sidebar slides over the map ---------- */
        @media (max-width: 768px) {
            #sidebar {
                position: fixed; top: 0; left: 0; bottom: 0;
                width: min(86vw, var(--sb-width)); margin-left: 0 !important;
                box-shadow: 8px 0 24px rgba(0,0,0,.5);
            }
            body.sb-collapsed #sidebar { transform: translateX(-105%); }
        }
        </style>

        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[-4.0182089629320314,37.65444804607245],[-2.8161825042456585,38.90035996834973]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        var bounds_group = new L.featureGroup([]);

        }
        function pop_geology_taita_0(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['fid'] !== null ? autolinker.link(String(feature.properties['fid']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\

                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['PERIMETER'] !== null ? autolinker.link(String(feature.properties['PERIMETER']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['GEO2_7G_'] !== null ? autolinker.link(String(feature.properties['GEO2_7G_']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['GEO2_7G_ID'] !== null ? autolinker.link(String(feature.properties['GEO2_7G_ID']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['GLG'] !== null ? autolinker.link(String(feature.properties['GLG']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

                    break;
            }
        }
        map.createPane('pane_geology_taita_0');
        map.getPane('pane_geology_taita_0').style.zIndex = 400;
        map.getPane('pane_geology_taita_0').style['mix-blend-mode'] = 'normal';
        var layer_geology_taita_0 = new L.geoJson(json_geology_taita_0, {
            attribution: '',
            interactive: true,
            dataVar: 'json_geology_taita_0',
            layerName: 'layer_geology_taita_0',
            pane: 'pane_geology_taita_0',
            onEachFeature: pop_geology_taita_0,
            style: style_geology_taita_0_0,
        });
        bounds_group.addLayer(layer_geology_taita_0);
        map.addLayer(layer_geology_taita_0);
        map.createPane('pane_prospectivity_classes_1');

        function img(src) { return '<img src="legend/' + src + '.png" alt="">'; }

        // Layer groups (same layers, grouping and order as the original layer tree)

        // ---- Layers: toggles + opacity ----

        function makeSwitch(checked, small, label) {

            return {wrap: el('span', {class: 'switch' + (small ? ' sm' : '')}, [input, el('span')]), input: input};
        }
        function setLayerVisible(item, visible) {
            if (visible) map.addLayer(item.layer); else map.removeLayer(item.layer);

            item.row.classList.toggle('off', !visible);

        function syncGroupSwitch(group) {
            group.input.checked = group.items.every(function (it) { return map.hasLayer(it.layer); });

            legendBox.innerHTML = '';

                    if (!map.hasLayer(item.layer)) return;

                    else body = el('div', {class: 'hint', text: 'Raster layer'});

                        item.legend || !item.icon ? el('div', {class: 'lg-name', text: item.name}) : null, body
                    ]));
                });
            });
            if (!shown) legendBox.appendChild(el('p', {class: 'hint', text: 'Turn on a layer to see its legend.'}));
        }
        renderLegend();

        // ---- Sidebar open / close ----
        var mobileQuery = window.matchMedia('(max-width: 768px)');

            document.body.classList.toggle('sb-collapsed', !open);

        }
        var ToggleControl = L.Control.extend({

        // ---- Search ----
        var searchIndex = [];
        function indexLayer(item, prop, kind, textFn) {
            var seen = {};
            item.layer.eachLayer(function (l) {
                var p = l.feature && l.feature.properties;
                var text = textFn ? textFn(p) : (p && p[prop]);
                if (text === null || text === undefined || text === '') return;
                text = String(text);
                if (seen[text.toLowerCase()]) return;
                seen[text.toLowerCase()] = true;
                searchIndex.push({text: text, kind: kind, feature: l, item: item});
            });
        }
        function findItem(layer) {
            var found = null;
            layerGroups.forEach(function (g) { g.items.forEach(function (it) { if (it.layer === layer) found = it; }); });

        indexLayer(findItem(layer_Villages_9), 'name', 'Village');

        function showResults(list, emptyText) {
            searchResults.innerHTML = '';
            list.forEach(function (r) {
                var btn = el('button', {type: 'button'}, [el('span', {text: r.text}), el('span', {class: 'kind', text: r.kind})]);
                btn.addEventListener('click', function () { r.go(); closeSidebarOnMobile(); });
                searchResults.appendChild(el('li', null, [btn]));
            });
            searchHint.textContent = list.length ? '' : emptyText;
        }
        function goToFeature(r) {
            if (!map.hasLayer(r.item.layer)) {
                setLayerVisible(r.item, true);
                layerGroups.forEach(syncGroupSwitch);
                renderLegend();
            }
            var f = r.feature;
            if (f.getLatLng) map.setView(f.getLatLng(), Math.max(map.getZoom(), 14));
            else map.fitBounds(f.getBounds(), {maxZoom: 14});
            f.openPopup(f.getLatLng ? f.getLatLng() : f.getBounds().getCenter());
        }
        function localSearch() {
            var q = searchInput.value.trim().toLowerCase();
            if (!q) { showResults([], "Type to search the map's own layers. Use the button to look up any place in Kenya."); return; }
            var hits = searchIndex.filter(function (s) { return s.text.toLowerCase().indexOf(q) !== -1; });
            hits.sort(function (a, b) {
                return (b.text.toLowerCase().indexOf(q) === 0) - (a.text.toLowerCase().indexOf(q) === 0) || a.text.localeCompare(b.text);
            });
            showResults(hits.slice(0, 30).map(function (s) {
                return {text: s.text, kind: s.kind, go: function () { goToFeature(s); }};
            }), 'No matches on the map layers. Try OpenStreetMap.');
        }
        searchInput.addEventListener('input', localSearch);
        document.getElementById('search-form').addEventListener('submit', function (e) {
            e.preventDefault();
            localSearch();
            var first = searchResults.querySelector('button');
            if (first) first.click();
        });
        document.getElementById('search-osm').addEventListener('click', function () {
            var q = searchInput.value.trim();
            if (!q) { searchInput.focus(); return; }
            searchHint.textContent = 'Searching OpenStreetMap…';
            fetch('https://nominatim.openstreetmap.org/search?format=geojson&countrycodes=ke&limit=8&q=' + encodeURIComponent(q))
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    showResults((data.features || []).map(function (f) {
                        var name = f.properties.display_name;
                        return {text: name, kind: 'OSM place', go: function () {
                            var ll = L.latLng(f.geometry.coordinates[1], f.geometry.coordinates[0]);
                            if (searchMarker) map.removeLayer(searchMarker);
                            searchMarker = L.marker(ll).bindPopup(name).addTo(map);
                            map.setView(ll, 15);
                            searchMarker.openPopup();

                    }), 'No places found.');

                .catch(function () { searchHint.textContent = 'Could not reach OpenStreetMap. Check your connection.'; });

        // ---- Measure distance ----
        map.createPane('pane_measure');

        var measureLayer = L.layerGroup().addTo(map);
        var measureLine = null;
        var measureBtn = document.getElementById('measure-toggle');
        var measureValue = document.getElementById('measure-value');
        function measureTotal() {
            var d = 0;
            for (var k = 1; k < measurePts.length; k++) d += map.distance(measurePts[k - 1], measurePts[k]);
            return d;
        }
        function updateMeasure() {
            var d = measureTotal();
            measureValue.textContent = d < 1000 ? Math.round(d) + ' m' : (d / 1000).toFixed(2) + ' km';
            if (measureLine) measureLine.setLatLngs(measurePts);
        }
        function setMeasuring(on) {
            measuring = on;
            map.getContainer().classList.toggle('measuring', on);
            measureBtn.textContent = on ? 'Finish' : 'Start measuring';
            if (on) { map.doubleClickZoom.disable(); map.closePopup(); closeSidebarOnMobile(); }
            else map.doubleClickZoom.enable();
        }
        function clearMeasure() {
            measureLayer.clearLayers();
            measurePts = [];
            measureLine = null;
            updateMeasure();
        }
        measureBtn.addEventListener('click', function () {
            if (!measuring && measurePts.length) clearMeasure();
            setMeasuring(!measuring);
        });
        document.getElementById('measure-clear').addEventListener('click', function () { clearMeasure(); setMeasuring(false); });
        map.on('click', function (e) {
            if (!measuring) return;
            var last = measurePts[measurePts.length - 1];
            if (last && last.equals(e.latlng)) return;
            measurePts.push(e.latlng);
            if (!measureLine) measureLine = L.polyline([], {pane: 'pane_measure', color: '#d4af37', weight: 3, dashArray: '6,6', interactive: false}).addTo(measureLayer);
            L.circleMarker(e.latlng, {pane: 'pane_measure', radius: 4, color: '#0b0b0b', weight: 2, fillColor: '#d4af37', fillOpacity: 1, interactive: false}).addTo(measureLayer);
            updateMeasure();
        });
        map.on('dblclick', function () { if (measuring) setMeasuring(false); });
        map.on('popupopen', function () { if (measuring) map.closePopup(); });
        setBounds();
        var i = 0;
        layer_wards_2.eachLayer(function(layer) {
            var context = {

            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);

        var i = 0;
        layer_Drillingcandidatezonesranked_4.eachLayer(function(layer) {
            var context = {
                feature: layer.feature,

            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;

        layer_villages_6.eachLayer(function(layer) {

            labels.push(layer);

            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);

        });
        var i = 0;
        layer_LakespondsanddamsOSM_15.eachLayer(function(layer) {
            var context = {
                feature: layer.feature,
                variables: {}
            };
            layer.bindTooltip((layer.feature.properties['name'] !== null?String('<div style="color: #1f4f8f; font-size: 12pt; font-style: italic; font-family: \'Arial\', sans-serif;">' + layer.feature.properties['name']).replace(/\\n/g, '<br>') + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_LakespondsanddamsOSM_15'});
            labels.push(layer);

              layer.added = true;
              addLabel(layer, i);

            layer.bindTooltip((layer.feature.properties['name'] !== null?String('<div style="color: #1f4f8f; font-size: 12pt; font-style: italic; font-family: \'Arial\', sans-serif;">' + layer.feature.properties['name']).replace(/\\n/g, '<br>') + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_RiversandstreamsOSM_16'});

        L.ImageOverlay.include({
            getBounds: function () {
                return this._bounds;

        });
        resetLabels([layer_wards_2,layer_Drillingcandidatezonesranked_4,layer_villages_6,layer_Villages_9,layer_LakespondsanddamsOSM_15,layer_RiversandstreamsOSM_16]);
        map.on("zoomend", function(){
            resetLabels([layer_wards_2,layer_Drillingcandidatezonesranked_4,layer_villages_6,layer_Villages_9,layer_LakespondsanddamsOSM_15,layer_RiversandstreamsOSM_16]);

            resetLabels([layer_wards_2,layer_Drillingcandidatezonesranked_4,layer_villages_6,layer_Villages_9,layer_LakespondsanddamsOSM_15,layer_RiversandstreamsOSM_16]);

            resetLabels([layer_wards_2,layer_Drillingcandidatezonesranked_4,layer_villages_6,layer_Villages_9,layer_LakespondsanddamsOSM_15,layer_RiversandstreamsOSM_16]);
